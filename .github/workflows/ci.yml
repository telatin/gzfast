name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

jobs:
  quick:
    name: Quick tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ['binary:2.2.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: ${{ matrix.nim-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push/PR confidence suite
        run: nimble -y testCi
      - name: Optimized package build
        run: nimble -y build -d:release

  full:
    name: Full release tests (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ['binary:2.2.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: ${{ matrix.nim-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Complete normal suite
        run: nimble -y test
      - name: Package install validation
        run: nimble -y testPackage

  docs:
    name: Docs
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble -y docs

  nim-devel:
    name: Nim devel
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: devel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble -y testCi

  asan:
    name: AddressSanitizer
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble -y testAsan

  ubsan:
    name: UndefinedBehaviorSanitizer
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble -y testUbsan

  fuzz-smoke:
    name: Fuzz smoke
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble -y fuzzSmoke

  valgrind:
    name: Valgrind
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: nim c --threads:on --mm:orc -p:src --hints:off tests/concurrency/test_workers.nim
      - run: valgrind --error-exitcode=1 --leak-check=full ./tests/concurrency/test_workers
      - run: nim c --threads:on --mm:orc -p:src --hints:off tests/unit/test_marker_resolve.nim
      - run: valgrind --error-exitcode=1 --leak-check=full ./tests/unit/test_marker_resolve

  thread-sanitizer:
    name: ThreadSanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: 'binary:2.2.10'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          nim c -r --threads:on --mm:orc -p:src --hints:off
          --passC:-fsanitize=thread --passL:-fsanitize=thread
          tests/concurrency/test_bounded_queue.nim
      - run: >-
          nim c -r --threads:on --mm:orc -p:src --hints:off
          --passC:-fsanitize=thread --passL:-fsanitize=thread
          tests/concurrency/test_public_stress.nim
